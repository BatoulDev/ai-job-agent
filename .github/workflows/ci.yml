name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older in-progress runs for the same PR/branch when a new commit
# lands, so CI minutes aren't wasted validating a commit that's already
# been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository and never
# writes back to it, comments, or touches other GitHub resources.
permissions:
  contents: read

jobs:
  quality-checks:
    name: quality-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Workflow tests
        run: npm run test:workflow

      - name: Build
        run: npm run build
        env:
          # Public, browser-safe placeholders only (see src/lib/supabase/env.ts —
          # both are documented as safe to expose to the browser and grant no
          # access beyond what Row Level Security allows). next build reads these
          # eagerly while collecting page data, so a value must be present, but
          # it never needs to point at a real project: no network call to
          # Supabase happens during a production build. No service-role key,
          # password, or other secret is used or required at build time —
          # verified locally by running `npm run build` with .env.local removed.
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"

  # NOT YET VALIDATED BY A REAL CI RUN — added by the MVP-readiness
  # implementation session (2026-10-27), proposed per the rollout this
  # repo already documented (see docs/PRODUCTION_READINESS.md's "CI and
  # database tests" section): a separate, initially non-required job using
  # supabase/setup-cli + `supabase start` against THIS repo's own
  # supabase/migrations (never a remote/production project — the CLI only
  # ever talks to the ephemeral Docker containers it starts on this
  # runner). `continue-on-error: true` so a problem here can never block a
  # merge while this is unproven; watch its first few real runs before
  # removing that line or marking it a required status check.
  db-tests:
    name: db-tests (unverified — informational only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3

      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start

      - name: Export local Supabase connection details for the test run
        # Field names (API_URL/PUBLISHABLE_KEY/SECRET_KEY) confirmed against
        # this exact CLI's own `supabase status -o env` output — these are
        # this ephemeral runner's own local demo credentials, never a real
        # secret, and never echoed to the step log.
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "LOCAL_TEST_DB_MARKER=ai-job-agent-local-db-tests"
            echo "MATCHING_WORKER_SECRET=ci-ephemeral-matching-worker-secret"
            echo "MATCHING_CANDIDATE_TOKEN_SECRET=ci-ephemeral-candidate-token-secret"
          } >> "$GITHUB_ENV"

      - name: DB tests
        run: npm run test:db
