<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your AI Job Agent password</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F8FAFC;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">

          <!-- Brand -->
          <tr>
            <td style="padding-bottom:24px;">
              <span style="font-size:18px;font-weight:700;color:#1E3A8A;letter-spacing:-0.5px;">AI Job Agent</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#ffffff;border-radius:16px;border:1px solid #E2E8F0;padding:40px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">

                <tr>
                  <td style="padding-bottom:12px;">
                    <h1 style="margin:0;font-size:22px;font-weight:600;color:#0F172A;letter-spacing:-0.4px;">Reset your password</h1>
                  </td>
                </tr>

                <tr>
                  <td style="padding-bottom:28px;">
                    <p style="margin:0;font-size:15px;line-height:1.65;color:#64748B;">
                      We received a request to reset your AI Job Agent password.
                      Click the button below to choose a new password.
                    </p>
                  </td>
                </tr>

                <tr>
                  <td style="padding-bottom:32px;">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;background-color:#1E3A8A;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:14px 28px;border-radius:100px;letter-spacing:0.1px;">
                      Reset password
                    </a>
                  </td>
                </tr>

                <tr>
                  <td style="border-top:1px solid #E2E8F0;padding-top:24px;">
                    <p style="margin:0;font-size:13px;line-height:1.6;color:#94A3B8;">
                      If you didn't request this change, you can safely ignore this email.
                      Your password will not be changed.
                    </p>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
